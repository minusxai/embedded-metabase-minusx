name: Project checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Refresh npm toolchain
        run: |
          npm install --global --no-audit --no-fund npm@12.2.1
          node patch-npm.mjs
          npm cache clean --force
      - run: npm ci
      - run: node --check server.js && node --check proxy.js
      - run: node test/http.cjs
      - run: docker build --tag project-web-fixture .
      - run: docker build --file Dockerfile.proxy --tag project-proxy-fixture .
      - run: docker run --rm --entrypoint node project-web-fixture test/http.cjs
      - run: docker run --rm --entrypoint node project-proxy-fixture test/http.cjs
